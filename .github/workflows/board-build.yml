name: Board firmware build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-rp2350:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game and board-support submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=waveshare_rp2350_touch_lcd_3.49

      - name: Build UF2
        run: cmake --build build --parallel

      - name: Report firmware artifact
        run: ls -lh build/pico-death-runner.uf2
